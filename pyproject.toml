[project]
name = "conf_root"
version = "0.5.0"
description = "基于dataclass的科研配置文件取用工具"
authors = [
    { name = "ciaranchen", email = "ciaranchen@qq.com" },
]
dependencies = [
    "pydantic>=2.10.5",
    "ruamel-yaml>=0.18.6"
]
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
urls = { "Homepage" = "https://github.com/ciaranchen/conf_root" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
web = [
    "wtforms>=3.1.2",
    "jinja2>=3.1.4",
]

[project.scripts]
conf-root-web = "conf_root.ConfRoot:main"

[tool.setuptools]
packages = ["conf_root", "conf_root.agents"]

[tool.setuptools.package-data]
conf_root = ["templates/*.html"]

[tool.pdm]
distribution = false

[[tool.pdm.source]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
verify_ssl = true
name = "pip_conf_index_global"